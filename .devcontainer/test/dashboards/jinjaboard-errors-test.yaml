views:
  - title: Path Missing
    icon: mdi:file-hidden
    strategy:
      type: custom:jinjaboard
      template: test/jinjaboard/errors/does_not_exist.yaml.j2

  - title: Path Traversal
    icon: mdi:folder-alert
    strategy:
      type: custom:jinjaboard
      template: ../../../../../../etc/hostname

  - title: Not Authorized
    icon: mdi:lock-alert
    strategy:
      type: custom:jinjaboard
      # Deliberately a real, valid, *existing* template — just not under the
      # test/jinjaboard/errors/ prefix this dashboard's allowlist entry
      # authorizes, so this demonstrates the authorization gate specifically,
      # not a path/content problem.
      template: test/jinjaboard/hello.yaml.j2

  - title: Include Not Found
    icon: mdi:file-question
    strategy:
      type: custom:jinjaboard
      template: test/jinjaboard/errors/include_not_found.yaml.j2

  - title: Template Error
    icon: mdi:code-braces
    strategy:
      type: custom:jinjaboard
      template: test/jinjaboard/errors/template_error.yaml.j2

  - title: YAML Parse Error
    icon: mdi:file-alert
    strategy:
      type: custom:jinjaboard
      template: test/jinjaboard/errors/yaml_parse_error.yaml.j2

  - title: Nested Include Error
    icon: mdi:file-tree
    strategy:
      type: custom:jinjaboard
      # root -> nested/middle.yaml.j2 -> nested/leaf.yaml.j2, undefined
      # variable in leaf.yaml.j2 — exercises the include-chain message
      # ordering fix (each file's own line number now stays anchored next
      # to that file's own segment of the message).
      template: test/jinjaboard/errors/nested_include_error.yaml.j2

  - title: Macro File Error
    icon: mdi:function-variant
    strategy:
      type: custom:jinjaboard
      template: test/jinjaboard/errors/macro_error.yaml.j2
      macros:
        - test/jinjaboard/errors/macros/bad.yaml.j2

  - title: Invalid Globals File
    icon: mdi:database-alert
    strategy:
      type: custom:jinjaboard
      # globals: points at a real, readable file, but its top-level value
      # is a list, not a mapping — globals files are never Jinja-rendered,
      # so this is a plain YAML-shape error, not a template_error.
      template: test/jinjaboard/errors/globals_root.yaml.j2
      globals: test/jinjaboard/errors/globals_not_a_mapping.yaml

  - title: Globals File Not Found
    icon: mdi:database-search
    strategy:
      type: custom:jinjaboard
      # Same include_not_found code a missing !include target produces —
      # globals: is resolved with the same "referenced file wasn't found"
      # handling, just for a different kind of reference.
      template: test/jinjaboard/errors/globals_root.yaml.j2
      globals: test/jinjaboard/errors/does_not_exist_globals.yaml

  - title: Globals Not Authorized
    icon: mdi:database-lock
    strategy:
      type: custom:jinjaboard
      # Same trick as "Not Authorized" above: a real, valid, *existing*
      # file — just not under the test/jinjaboard/errors/ prefix this
      # dashboard's allowlist entry authorizes. globals: is a
      # dashboard-author-controlled top-level field, same trust boundary as
      # template: itself, so it's checked against the allowlist too — the
      # root template here is never actually rendered, since this check
      # runs first (its content doesn't matter for this test).
      template: test/jinjaboard/errors/noop_root.yaml.j2
      globals: test/jinjaboard/hello.yaml.j2

  - title: Macro Not Authorized
    icon: mdi:lock-alert-outline
    strategy:
      type: custom:jinjaboard
      # Same as "Globals Not Authorized" above, for a macros: entry instead
      # — an existing, valid file outside the authorized prefix.
      template: test/jinjaboard/errors/noop_root.yaml.j2
      macros:
        - test/jinjaboard/hello.yaml.j2
